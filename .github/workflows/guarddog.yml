name: GuardDog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guarddog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install 'guarddog<3.0.0'
      - run: guarddog npm scan src/
